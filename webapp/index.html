<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Colegio Santo Domingo Bilingüe</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
  <main class="app-container">
    <header style="text-align: center;">
        <div class="header-top" style="justify-content: center; position: relative;">
          <img src="/logo-colegio.png" alt="Colegio Santo Domingo Bilingüe" style="max-height: 80px; object-fit: contain;" />
          <button id="btnSettings" class="btn-icon" title="Configurar Cámara" style="position: absolute; right: 0;">⚙️</button>
        </div>
        <p class="subtitle" style="margin-top: 10px; font-weight: 600; color: #e2e8f0; letter-spacing: 1px;">Control de Acceso Biométrico</p>
    </header>

      <section class="camera-container">
        <!-- Contenedor del video y overlays -->
        <div class="video-wrapper">
          <video id="videoElement" autoplay playsinline muted></video>
          <!-- Contenedor para dibujar rectángulos faciales -->
          <canvas id="overlayCanvas"></canvas>
          <!-- Overlay de escaneo (barra que baja y sube) -->
          <div class="scan-line"></div>
          
          <!-- Guía visual del rostro (Óvalo) -->
          <div id="faceGuide" class="face-guide"></div>
          
          <!-- Drawer Rotate (Izquierda) -->
          <div class="drawer drawer-left">
            <div class="drawer-content">
              <button id="btnRotateView" class="drawer-btn" title="Rotar Vista">⤵️ Girar</button>
            </div>
            <div class="drawer-tab" onclick="this.parentElement.classList.toggle('open')"><span class="arrow">▶</span></div>
          </div>
          
          <!-- Drawer Flip (Derecha) -->
          <div class="drawer drawer-right">
            <div class="drawer-tab" onclick="this.parentElement.classList.toggle('open')"><span class="arrow">◀</span></div>
            <div class="drawer-content">
              <button id="btnFlipCamera" class="drawer-btn" title="Voltear Cámara">🔄 Voltear</button>
            </div>
          </div>
          
          <!-- Drawer Zoom (Arriba) -->
          <div class="drawer drawer-top">
            <div class="drawer-content" id="zoomContainer">
              <span id="zoomLabel" style="font-weight: bold; min-width: 55px; text-align: left; white-space: nowrap;">🔍 1x</span>
              <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" style="width: 100px; cursor: pointer;">
            </div>
            <div class="drawer-tab" onclick="this.parentElement.classList.toggle('open')"><span class="arrow" style="margin-right: 5px;">▼</span> Zoom</div>
          </div>

          <!-- Elemento para QR (si la librería html5-qrcode lo necesita, inyectará aquí) -->
          <div id="qr-reader" style="display: none;"></div>
        </div>
        
        <!-- Contenedor para input manual (Oculto por defecto) -->
        <div id="manualCodeContainer" class="hidden" style="margin-top: 15px; display: flex; gap: 10px; max-width: 640px; margin-left: auto; margin-right: auto; flex-wrap: wrap;">
          <input type="text" id="manualCodeInput" placeholder="O escriba su código manualmente" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); color: white; min-width: 200px;" />
          <button id="btnSubmitCode" class="btn btn-primary">Aceptar Código</button>
        </div>
        
        <!-- Feedback de distancia de rostro -->
        <div id="feedbackText" class="feedback-text">Iniciando sistema...</div>
      </section>

      <section class="controls">
        <button id="btnRegister" class="btn btn-primary">
          <span class="icon">➕</span> Registrarse
        </button>
        <button id="btnLogin" class="btn btn-secondary">
          <span class="icon">🔓</span> Ingresar
        </button>
      </section>
      
      <!-- Estado actual de la aplicación -->
      <div id="appState" class="app-state">Listo para operar</div>

      <!-- Sección de Tabla de Registros -->
      <section class="records-section" style="margin-top: 20px; width: 100%;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; margin-bottom: 10px; flex-wrap: wrap; gap: 15px;">
          <div style="display: flex; flex-direction: column; min-width: 150px;">
            <h2 style="font-size: 1.2rem; margin: 0;">Historial de Ingresos</h2>
            <span id="recordCounter" style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">Cargando...</span>
          </div>
          <button id="btnToggleFilters" class="btn-glass" style="margin: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;">
              <line x1="21" y1="6" x2="3" y2="6"></line>
              <line x1="21" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="18" x2="3" y2="18"></line>
              <circle cx="8" cy="6" r="3" fill="var(--bg-dark)"></circle>
              <circle cx="16" cy="12" r="3" fill="var(--bg-dark)"></circle>
              <circle cx="10" cy="18" r="3" fill="var(--bg-dark)"></circle>
            </svg>
            Filtros
          </button>
        </div>
        
        <!-- Panel de Filtros Desplegable -->
        <div id="filterPanel" class="filter-panel hidden">
          <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px;">
            <div style="flex: 1; min-width: 140px;">
              <span style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 5px; display: block;">Buscar por Nombre:</span>
              <input type="text" id="searchName" class="filter-input" placeholder="🔍 Ej. Juan Perez" style="margin-top: 0;">
            </div>
            <div style="flex: 1; min-width: 140px;">
              <span style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 5px; display: block;">Buscar por Código:</span>
              <input type="text" id="searchCode" class="filter-input" placeholder="🔍 Ej. 12345" style="margin-top: 0;">
            </div>
          </div>
          
          <div class="filter-modes">
            <span style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 5px; display: block;">Rango de tiempo:</span>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 10px;">
              <label class="radio-label">
                <input type="radio" name="dateMode" value="all" checked> Toda la vida
              </label>
              <label class="radio-label">
                <input type="radio" name="dateMode" value="today"> Hoy
              </label>
              <label class="radio-label">
                <input type="radio" name="dateMode" value="custom"> Rango Personalizado
              </label>
            </div>
          </div>
          
          <div id="customDateInputs" class="custom-dates hidden" style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px;">
            <div style="display: flex; flex-direction: column; flex: 1; min-width: 140px;">
              <span style="font-size: 0.75rem; color: rgba(255,255,255,0.7);">Desde:</span>
              <input type="datetime-local" id="filterStart" class="filter-input" style="color-scheme: dark; margin-top: 2px;">
            </div>
            <div style="display: flex; flex-direction: column; flex: 1; min-width: 140px;">
              <span style="font-size: 0.75rem; color: rgba(255,255,255,0.7);">Hasta:</span>
              <input type="datetime-local" id="filterEnd" class="filter-input" style="color-scheme: dark; margin-top: 2px;">
            </div>
          </div>
          
          <div style="text-align: right; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
            <button id="btnClearFilters" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem; background: rgba(255,50,50,0.2); border-color: rgba(255,50,50,0.5);">
              ❌ Limpiar Todo
            </button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="glass-table" id="recordsTable">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Nombre</th>
                <th>Código</th>
              </tr>
            </thead>
            <tbody id="recordsTableBody">
              <!-- Las filas se generarán dinámicamente aquí -->
            </tbody>
          </table>
        </div>
      </section>

    </main>

    <!-- Contenedor para Notificaciones (Toasts) -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Modal de Configuración de Cámara -->
    <div id="cameraModal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2>Configurar Cámara</h2>
        <p>Selecciona la cámara que deseas usar:</p>
        <select id="cameraSelect" class="styled-select">
          <option value="">Cargando cámaras...</option>
        </select>
        <div style="margin-top: 15px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;">
          <label for="autoRotateToggle" style="font-weight: bold; cursor: pointer;">Giro Automático de IA</label>
          <input type="checkbox" id="autoRotateToggle" checked style="width: 18px; height: 18px; cursor: pointer;">
        </div>
        
        <div class="modal-actions" style="justify-content: center;">
          <button id="btnCloseModal" class="btn btn-secondary">Cerrar</button>
        </div>
        
        <hr style="border: none; border-top: 1px solid var(--glass-border); margin-top: 5px;">
        
        <div style="text-align: center;">
          <button id="btnClearDB" class="btn btn-danger" style="width: 100%; font-size: 0.9rem;">
            🗑️ Borrar Todos los Registros
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
